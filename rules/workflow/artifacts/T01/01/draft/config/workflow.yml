version: "1"
initialState: SUBMITTED
states:
  - SUBMITTED
  - DOCUMENTS_VERIFIED
  - UNDER_ASSESSMENT
  - PENDING_INFO
  - APPROVED
  - REJECTED
  - PAYMENT_INITIATED
  - CLOSED
roles: [document_clerk, team_lead, assessor, finance, system]
maxInformationRequests: 3
transitions:
  - from: SUBMITTED
    to: DOCUMENTS_VERIFIED
    role: document_clerk
    guards:
      - type: allDocumentsValid
        field: requiredDocuments
        message: All required documents must be present and valid
    effects: [notify_assessors]
  - from: DOCUMENTS_VERIFIED
    to: UNDER_ASSESSMENT
    role: team_lead
    guards:
      - type: present
        field: assessorId
        message: An assessor must be assigned
    effects: [assessment_started]
    timerAction: START
  - from: UNDER_ASSESSMENT
    to: APPROVED
    role: assessor
    guards:
      - type: isTrue
        field: reportComplete
        message: Assessment report must be complete
      - type: lessOrEqual
        field: assessmentAmount
        otherField: policyLimit
        message: Assessment amount must not exceed policy limit
      - type: equal
        field: assessmentCurrency
        otherField: currency
        message: Assessment currency must match claim currency
      - type: allDocumentsValid
        field: requiredDocuments
        message: All required documents must be present and valid
    effects: [notify_approval, create_payment_request]
  - from: UNDER_ASSESSMENT
    to: REJECTED
    role: assessor
    guards:
      - type: isTrue
        field: reportComplete
      - type: present
        field: rejectionReason
    effects: [notify_rejection]
  - from: UNDER_ASSESSMENT
    to: PENDING_INFO
    role: assessor
    guards:
      - type: present
        field: missingInfoDescription
    effects: [request_information]
    informationRequest: true
    clearFacts: [reportComplete, assessmentAmount, assessmentCurrency]
  - from: PENDING_INFO
    to: DOCUMENTS_VERIFIED
    role: document_clerk
    guards:
      - type: after
        field: informationReceivedAt
        otherField: lastInformationRequestedAt
        message: New information must have been received after the request
      - type: allDocumentsValid
        field: requiredDocuments
    effects: [assessment_timer_reset]
    timerAction: RESET
  - from: APPROVED
    to: PAYMENT_INITIATED
    role: finance
    guards:
      - type: isTrue
        field: paymentRequestCreated
    effects: [trigger_payment]
  - from: PAYMENT_INITIATED
    to: CLOSED
    role: finance
    guards:
      - type: isTrue
        field: paymentConfirmed
      - type: present
        field: paymentReference
    effects: [notify_payment]
  - from: REJECTED
    to: CLOSED
    role: system
    guards:
      - type: any
        guards:
          - type: beforeOrEqual
            field: appealDeadline
            otherField: now
            message: Appeal period has not expired
          - type: isTrue
            field: memberAcknowledged
            message: Member must acknowledge rejection or appeal period must expire
        message: Appeal period must expire or member must acknowledge rejection
    effects: [archive_claim]
